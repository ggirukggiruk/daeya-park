<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시흥 대야 회중 공원 구역 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F4;
  --paper-2:#FFFFFF;
  --ink:#18222B;
  --muted:#5E6B76;
  --line:#D3DCE3;
  --accent:#206FAB;
  --accent-soft:#DCE8F2;
  --mark:#CBE2F5;
  --on-accent:#FFFFFF;
  --band-bg:#206FAB;
  --band-fg:#FFFFFF;
  --brand-edge:rgba(0,0,0,.08);
  color-scheme:only light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top, 0px)}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;overflow-wrap:break-word;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 72px}

/* ---------- 표지 ---------- */
.masthead{
  margin:0 -20px;padding:52px 20px 30px;
  background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);
}
.lockup{display:flex;align-items:center;gap:14px}
.brand{
  flex:none;display:block;width:52px;height:52px;border-radius:12px;
  box-shadow:0 0 0 1px var(--brand-edge);
}
.place{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:600;font-size:clamp(24px, 6.8vw, 31px);line-height:1.25;margin:0;letter-spacing:-.02em}
.place-sub{margin:14px 0 0;color:var(--muted);font-size:14.5px}

/* ---------- 단계 ---------- */
.flowgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcard{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
  background:var(--accent-soft);border-radius:16px;padding:20px 12px;
}
.fcard svg{
  width:38px;height:38px;stroke:var(--accent);fill:none;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;
}
.fcard b{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:16.5px;font-weight:600;line-height:1.3}
.fcard span{font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- 색인 ---------- */
.ask{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:500;font-size:21px;margin:42px 0 16px}
.ask.first{margin-top:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  overflow:hidden;display:flex;flex-direction:column;
  width:100%;text-align:left;padding:0;color:var(--ink);
  background:linear-gradient(180deg, var(--accent-soft) 0%, var(--paper-2) 64%);
  border:1px solid var(--line);border-radius:18px;font:inherit;cursor:pointer;
}
.tile{transition:transform .12s, border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tphoto{display:block}
.tphoto img{display:block;width:100%;height:108px;object-fit:contain;padding:14px 14px 4px}
.tmeta{display:block;padding:10px 15px 16px}
.tname{display:block;font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:18px;font-weight:600;line-height:1.3}
.tcount{display:block;font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- 구역 ---------- */
.spot{margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.spothead{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:44px;margin:0;padding:0;
  background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;
}
.spothead:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.spot h2{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:21px;font-weight:500;margin:0}
.spotstate{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  color:var(--accent);font-size:13.5px;font-weight:500;
}
.spotstate svg{
  width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;
}
.spothead[aria-expanded="true"] .spotstate svg{transform:rotate(180deg)}
.spot p{margin:14px 0 0;font-size:15px;color:var(--muted)}
.dong{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 2px;padding-bottom:7px;border-bottom:1.5px solid var(--accent)}
.dong h3{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:17px;font-weight:600;margin:0}
.dong span{font-size:13px;color:var(--muted)}
.parks{list-style:none;margin:0;padding:0}
.parks li{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.parks a{flex:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;color:var(--ink);text-decoration:none}
.parks a:hover .pname{color:var(--accent)}
.parks a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.pname{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:17px;font-weight:500}
.paddr{font-size:13px;color:var(--muted)}
.note{margin:40px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.75}
.note .jw{vertical-align:-3px;margin-right:4px}

/* ---------- 상세 ---------- */
.detail{
  position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);
  transform:translateX(100%);visibility:hidden;
  transition:transform .26s cubic-bezier(.2,.7,.3,1),visibility .26s;
}
.detail.open{transform:none;visibility:visible}
.bar{
  position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top, 0px)) 20px 12px;max-width:560px;margin:0 auto;
}
.back{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  background:var(--accent);border:0;border-radius:999px;
  padding:11px 17px 11px 14px;margin:0;min-height:44px;
  color:var(--on-accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
}
.back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:19px;font-weight:600;margin:0}
.toggle{
  flex:none;min-height:44px;background:var(--accent-soft);border:0;border-radius:999px;
  padding:0 15px;color:var(--accent);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
}
.back:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}


.band{margin:24px -20px 0;padding:20px;background:var(--band-bg);color:var(--band-fg)}
.band .blabel{margin:0 0 12px;font-size:12.5px;font-weight:600;letter-spacing:.02em;opacity:.8}
.band ul{list-style:none;margin:0;padding:0}
.band li{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:500;font-size:17px;line-height:1.75;margin-bottom:8px}
.band li:last-child{margin-bottom:0}

.qrow{
  display:flex;align-items:flex-start;gap:12px;
  width:100%;text-align:left;margin:0;padding:18px 0;
  background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--accent);font:inherit;font-size:16px;line-height:1.7;cursor:pointer;
}
.qrow .qtext{flex:1}
.qtag{
  display:block;width:fit-content;margin:0 0 8px;
  padding:3px 11px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);
  font-size:11.5px;font-weight:600;letter-spacing:.04em;line-height:1.6;
}
.qrow .chev{
  flex:none;width:20px;height:20px;margin-top:4px;
  stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;
}
.qrow[aria-expanded="true"] .chev{transform:rotate(180deg);stroke:var(--accent)}
.qrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.hl{background:var(--mark);font-weight:600;font-style:normal;padding:0 2px;border-radius:3px}

.refs{margin:0 0 4px;padding:16px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px}
.jwbar{display:flex;align-items:center;gap:7px;margin-bottom:12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.jw{width:18px;height:18px;border-radius:3px;display:inline-block}
.rgroup{margin-bottom:12px}
.rgroup:last-child{margin-bottom:0}
.rgroup h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rlist{display:flex;flex-wrap:wrap;gap:10px}
.ritem{display:flex;flex-direction:column;gap:5px;max-width:100%}
.rcap{font-size:12.5px;color:var(--muted);padding-left:3px;max-width:100%}
.qplain{
  padding:18px 0;border-bottom:1px solid var(--line);
  color:var(--accent);font-size:16px;line-height:1.7;
}
.qplain .qtag{margin-bottom:7px}
.rlink{
  display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;
  background:var(--paper);border:1px solid var(--accent);color:var(--accent);
  text-decoration:none;font-size:14px;font-weight:500;line-height:1.35;
}
.rlink.lesson{border-style:dashed}
.rlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dnote{margin:24px 0 0;font-size:13px;color:var(--muted);line-height:1.75}

@media (max-width:339px){ .grid,.flowgrid{grid-template-columns:1fr} }
@media (min-width:480px){ body{font-size:18px} }
@media (prefers-reduced-motion:reduce){ .detail,.chev{transition:none} }
</style>
</head>

          { q:'질문. 이렇게 동물을 사랑하는 분들을 *성경에서도 아주 높게 평가*한다는 걸 알고 계셨나요?',
            bible:[ v('잠언 12:10','20/12#study=discover&v=20:12:10') ],
            lesson:[ ls('행누8과 3항','1102021208') ] }
        ] }
    ] },

  { id:'couple', name:'연인·부부',
    blocks:[
      { openers:['제가 사진 찍어 드릴까요?','두 분이 정말 잘 어울리시네요.','두 분이 정말 행복해 보이세요.'],
        qs:[
          { q:'질문. *영원히 행복한 가정*을 이룰 수 있는 비결이 있을까요?',
            bible:[ v('에베소 5:28','49/5#study=discover&v=49:5:28') ],
            lesson:[ ls('행누 49과','1102021249'), ls('행누 50과','1102021250','자녀가 있다면') ] }
        ] },
      { openers:['두 분이 다정하게 산책하시는 모습이 너무 아름다워 보입니다.','오래도록 함께 걸어오신 깊은 신뢰가 느껴지네요.'],
        qs:[
          { q:'질문. 요즘 부부 사이의 사랑을 유지하기가 참 힘든데, 사랑이라는 감정은 *시간이 지나면 시드는 것*이 당연한 것일까요?',
            bible:[ v('마태복음 19:6','40/19#study=discover&v=40:19:6','더욱 단단해지도록 설계되었습니다.') ],
            lesson:[ ls('행누49과 1,2항 성구사용','1102021249') ] }
        ] }
    ] },

  { id:'stage', name:'공연 관람',
    blocks:[
      { openers:['공연을 보시면 어떤 유익이 있나요?'],
        qs:[
          { q:'질문. (답을 들은 후) *기쁨과 행복감을 지속적으로* 주는 것이 있을까요?',
            bible:[], lesson:[ ls('행누2과 2항,4항에 있는 성구사용','1102021202') ] }
        ] },
      { openers:['안녕하세요! 오늘 공연보러 오셨나봐요.','안녕하세요. 오늘 여기서 공연이 있나봐요? 누구 공연인지 아세요?','평소에 이런 음악공연 자주 즐기시나요?','음악은 참 신기한 것 같아요. 기분을 금세 행복하게 만들어 주지 않나요?'],
        qs:[
          { q:'질문. 우리 인간에게 음악을 만들고 즐길 수 있는 이런 멋진 능력을 누가 주셨을까? 이런 멋진 능력을 주신분이 *어떤분일까?* 생각해 보신 적 있으세요?',
            bible:[ v('잠언 20:12','20/20#study=discover&v=20:20:12'), v('요한1서 4:8','62/4#study=discover&v=62:4:8') ],
            lesson:[ ls('행누 7과 3항','1102021207') ] }
        ] },
      { openers:['오늘 공연보러 오셨군요! 표정도 밝으시고 설레 보이세요.','좋아하는 아티스트 음악을 직접 들으면 정말 가슴 벅차죠?'],
        qs:[
          { q:'질문. 그런 감동과 행복이 잠깐의 이벤트가 아니라 우리 삶속에서 *매일매일 영원히 이어진다면* 인생이 즐겁지 않을까요?',
            bible:[ v('이사야 35:10','23/35#study=discover&v=23:35:10') ],
            lesson:[ ls('행누 3과','1102021203') ] }

    ] }

/* ---------- 색인 ---------- */
document.getElementById('grid').innerHTML = TOPICS.map(t => `
  <button class="tile" type="button" data-id="${t.id}">
    <span class="tphoto"><img src="${PHOTO[t.id]}" alt=""></span>
    <span class="tmeta">
      <span class="tname">${t.name}</span>
      <span class="tcount">대화 ${t.blocks.length}가지</span>
    </span>
  </button>`).join('');

/* ---------- 구역 ---------- */
const byDong = PARKS.reduce((m, p) => ((m[p.dong] = m[p.dong] || []).push(p), m), {});
document.getElementById('parks').innerHTML = Object.entries(byDong).map(([dong, list]) => `
    <div class="dong"><h3>${dong}</h3><span>${list.length}곳</span></div>
    <ul class="parks">${list.map(p => `
      <li>
        <a href="https://map.naver.com/p/search/${encodeURIComponent('시흥시 ' + p.addr)}" target="_blank" rel="noopener">
          <span class="pname">${p.name}</span>
          <span class="paddr">${p.addr}</span>
        </a>
      </li>`).join('')}</ul>`).join('');

const spotBtn = document.getElementById('spotToggle');
spotBtn.addEventListener('click', () => {
  const open = spotBtn.getAttribute('aria-expanded') !== 'true';
  spotBtn.setAttribute('aria-expanded', String(open));
  document.getElementById('parksWrap').hidden = !open;
  document.getElementById('spotLabel').textContent = open ? '닫기' : '열기';
});

/* ---------- 상세 ---------- */
const detail = document.getElementById('detail');
const dTitle = document.getElementById('dTitle');
const dBody  = document.getElementById('dBody');
const toggle = document.getElementById('toggle');

const mark  = s => s.replace(/\*([^*]+)\*/g, '<em class="hl">$1</em>');
const qbody = t => {
  const m = t.match(/^질문\.\s*/);
  return (m ? '<span class="qtag">질문</span>' : '') + mark(m ? t.slice(m[0].length) : t);
};
const chev  = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const links = (items, cls) => items.map(r => `
  <span class="ritem">
    <a class="rlink ${cls}" href="${r.url}" target="_blank" rel="noopener">${r.label}</a>
    ${r.note ? `<span class="rcap">${r.note}</span>` : ''}
  </span>`).join('');

function render(t){
  dTitle.textContent = t.name;
  let n = 0;

  dBody.innerHTML = `
    ${t.blocks.map(b => `
      <div class="band">
        <p class="blabel">[대화시작]</p>
        <ul>${b.openers.map(o => `<li>${o}</li>`).join('')}</ul>
      </div>
      ${b.qs.map(x => {
        if (!x.bible.length && !x.lesson.length)
          return `<p class="qplain">${qbody(x.q)}</p>`;
        const id = 'r' + (n++);
        return `
        <button class="qrow" type="button" aria-expanded="false" aria-controls="${id}">
          <span class="qtext">${qbody(x.q)}</span>${chev}
        </button>
        <div class="refs" id="${id}" hidden>
          <p class="jwbar"><img class="jw" alt="" src="${LOGO}">JW 라이브러리에서 열립니다</p>
          ${x.bible.length ? `<div class="rgroup"><h4>성구</h4><div class="rlist">${links(x.bible,'bible')}</div></div>` : ''}
          ${x.lesson.length ? `<div class="rgroup"><h4>참고 자료</h4><div class="rlist">${links(x.lesson,'lesson')}</div></div>` : ''}
        </div>`;
      }).join('')}`).join('')}

    <p class="dnote">링크를 누르면 JW 라이브러리가 열립니다. 성구 본문은 그곳에서 보시거나 성경을 직접 펴서 읽으시면 됩니다.</p>`;

  dBody.querySelectorAll('.qrow').forEach(btn => {
    btn.addEventListener('click', () => setRow(btn, btn.getAttribute('aria-expanded') !== 'true'));
  });
  setToggle(false);
}

function setRow(btn, open){
  btn.setAttribute('aria-expanded', String(open));
  btn.nextElementSibling.hidden = !open;
}
function setToggle(allOpen){
  toggle.dataset.open = String(allOpen);
  toggle.textContent = allOpen ? '모두 접기' : '모두 펼치기';
}
toggle.addEventListener('click', () => {
  const open = toggle.dataset.open !== 'true';
  dBody.querySelectorAll('.qrow').forEach(btn => setRow(btn, open));
  setToggle(open);
});

function openTopic(id){
  const t = TOPICS.find(x => x.id === id);
  if (!t) return closeTopic();
  render(t);
  detail.classList.add('open');
  detail.setAttribute('aria-hidden','false');
  detail.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  document.getElementById('back').focus();
}

function closeTopic(){
  detail.classList.remove('open');
  detail.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

document.getElementById('grid').addEventListener('click', e => {
  const b = e.target.closest('.tile');
  if (b) location.hash = 't/' + b.dataset.id;
});
document.getElementById('back').addEventListener('click', () => history.back());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && detail.classList.contains('open')) history.back();
});

function route(){
  const m = location.hash.match(/^#t\/(.+)$/);
  if (m) openTopic(decodeURIComponent(m[1])); else closeTopic();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
